<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="img/logo.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>Finalizar compra | Urban Vape</title></head><body>
<main class="wrap ck"><div><h1>Finalizar compra</h1><p id="empty" style="display:none;margin-top:16px">Seu carrinho está vazio. <a href="index.html" style="color:var(--neon)">Voltar à loja</a></p>
<form id="ckf"><h2 style="grid-column:span 6">Seus dados</h2>
<label>Nome completo<input name="nome" required autocomplete="name"></label>
<label class="s2">E-mail<input name="email" type="email" required autocomplete="email"></label><label class="s2">WhatsApp<input name="tel" type="tel" required autocomplete="tel" placeholder="(31) 90000-0000"></label>
<label class="s2">CPF<input name="cpf" required inputmode="numeric" maxlength="14"></label><label class="s2">Data de nascimento<input name="nasc" type="date" required></label>
<h2 style="grid-column:span 6">Entrega</h2>
<label class="s2">CEP<input id="cep" name="cep" required inputmode="numeric" maxlength="9" autocomplete="postal-code"></label>
<label class="s4">Rua<input name="rua" required></label><label class="s2">Número<input name="numero" required></label><label class="s4">Complemento<input name="compl"></label>
<label class="s2">Bairro<input name="bairro" required></label><label class="s4">Cidade<input name="cidade" required></label><label class="s2">UF<input name="uf" required maxlength="2"></label>
<h2 style="grid-column:span 6">Pagamento</h2>
<div class="pay"><label><input type="radio" name="pagamento" value="pix" checked style="width:auto;margin:0"> Pix</label><label><input type="radio" name="pagamento" value="cartao" style="width:auto;margin:0"> Cartão</label></div>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="maior" required style="width:auto;margin:0"> Declaro ter 18 anos ou mais.</label>
<p id="msg"></p><button class="btn" id="pay" style="grid-column:span 6">Finalizar pedido</button></form></div>
<aside class="sum"><h2 style="font-size:26px">Resumo</h2><div id="sum"></div></aside></main>
<script src="js/app.js"></script><script src="js/checkout.js"></script></body></html>
